name: E2E Test Runner

on:
  pull_request:


permissions:
  contents: read
  packages: read # @cumulocity-iot/ui-sdk from GitHub Packages
  pull-requests: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git diff

      - name: Detect changed packages
        id: set-matrix
        run: |
          git fetch origin main
          components=$(git diff --name-only origin/main...HEAD | grep '^packages/' | cut -d '/' -f2 | sort -u | grep -v '^shared$' || true)
          if [ -z "$components" ]; then
            echo "matrix={\"component\": []}" >> $GITHUB_OUTPUT
          else
            components_json=$(echo "$components" | jq -R -s -c 'split("\n") | map(select(. != ""))')
            echo "matrix={\"component\": $components_json}" >> $GITHUB_OUTPUT
          fi
        shell: bash

  test-components:
    needs: detect-changes
    runs-on: ubuntu-latest
    # windy-dev credentials for pulling the mock's world
    environment: e2e
    if: fromJson(needs.detect-changes.outputs.matrix).component != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    name: E2E Test ${{ matrix.component }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          # @cumulocity-iot/ui-sdk (the tenant mock) comes from GitHub Packages
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cumulocity-iot'

      - name: Cache Cumulocity shell builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/c8y-ui
          key: c8y-ui-shells-${{ hashFiles('test/c8y-ui.json', 'package.json') }}
          restore-keys: |
            c8y-ui-shells-

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('test/package.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install test workspace dependencies
        run: pnpm -C test install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cypress binary
        run: pnpm -C test exec cypress install

      - name: Set up go-c8y-cli
        uses: reubenmiller/setup-go-c8y-cli@9b6147a9f916607a3c1db392eab6e54e3e8c3f01 # v2
        with:
          showTenant: 'false'

      # The world is not committed: pull the current windy-dev data for this run.
      - name: Pull the mock world from windy-dev
        run: pnpm run e2e:world:pull
        timeout-minutes: 5
        env:
          C8Y_HOST: ${{ vars.WINDY_C8Y_HOST }}
          C8Y_USER: ${{ vars.WINDY_C8Y_USER }}
          C8Y_PASSWORD: ${{ secrets.WINDY_C8Y_PASSWORD }}

      # Mocked tenant (windy-dev world) with the cockpit release of the workspace's Web SDK version;
      # starts the plugin's dev server against it and runs its Cypress suite.
      - name: Run Cypress Tests against the tenant mock (package ${{ matrix.component }})
        run: pnpm run e2e:mock ${{ matrix.component }}
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Upload Cypress Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.component }}
          path: test/cypress/screenshots
