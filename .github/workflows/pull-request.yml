name: PR Component CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      root-config: ${{ steps.set-matrix.outputs.root-config }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git diff

      - name: Detect changed packages
        id: set-matrix
        run: |
          git fetch origin main
          changed=$(git diff --name-only origin/main...HEAD)
          components=$(echo "$changed" | grep '^packages/' | cut -d '/' -f2 | sort -u || true)
          if [ -z "$components" ]; then
            echo "matrix={\"component\": []}" >> $GITHUB_OUTPUT
          else
            components_json=$(echo "$components" | jq -R -s -c 'split("\n") | map(select(. != ""))')
            echo "matrix={\"component\": $components_json}" >> $GITHUB_OUTPUT
          fi

          # A change to shared build/lint/test configuration affects every package,
          # but matches no package directory — without this the whole workflow
          # would be skipped for such a PR.
          if echo "$changed" | grep -qE '^(angular\.json|tsconfig\.json|eslint\.config\.mjs|karma\.conf\.js|package\.json|pnpm-workspace\.yaml|pnpm-lock\.yaml|\.npmrc|\.pnpmfile\.cjs|\.prettierrc|tools/)'; then
            echo "root-config=true" >> $GITHUB_OUTPUT
          else
            echo "root-config=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

  test-components:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: fromJson(needs.detect-changes.outputs.matrix).component != '[]'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    name: Test ${{ matrix.component }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint ${{ matrix.component }}
        run: pnpm exec eslint ./packages/${{ matrix.component }} --quiet

      - name: Test ${{ matrix.component }}
        run: |
          # Resolve the Angular project name from the package directory via angular.json
          project=$(jq -r --arg root "packages/${{ matrix.component }}" \
            '.projects | to_entries[] | select(.value.root == $root) | .key' angular.json)

          if [ -z "$project" ]; then
            echo "No Angular project found for packages/${{ matrix.component }} — skipping tests."
            exit 0
          fi

          # Check whether the project has a Karma test target
          has_test=$(jq -r --arg p "$project" \
            '.projects[$p].architect.test | if . then "yes" else empty end' angular.json)

          if [ -z "$has_test" ]; then
            echo "No test target configured for project '$project' — skipping tests."
            exit 0
          fi

          echo "Running Karma/Jasmine tests for project '$project'..."
          pnpm exec ng test "$project" --watch=false --browsers=ChromeHeadlessCI

      - name: Build ${{ matrix.component }}
        id: build
        run: |
          # Mirror the test step and degrade gracefully rather than failing hard
          # when a package has no build script.
          if ! jq -e --arg s "build:${{ matrix.component }}" '.scripts[$s]' package.json >/dev/null; then
            echo "No build:${{ matrix.component }} script — skipping build."
            echo "artifact-path=" >> $GITHUB_OUTPUT
            exit 0
          fi

          pnpm run build:${{ matrix.component }}

          # Plugins build to the root dist/<outputPath>; the shared library is
          # built by ng-packagr into packages/shared/dist.
          project=$(jq -r --arg root "packages/${{ matrix.component }}" \
            '.projects | to_entries[] | select(.value.root == $root) | .key' angular.json)
          out=$(jq -r --arg p "$project" \
            '.projects[$p].architect.build.options.outputPath // empty' angular.json)

          if [ -z "$out" ]; then
            out="packages/${{ matrix.component }}/dist"
          fi

          echo "artifact-path=$out" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload build artifact
        if: steps.build.outputs.artifact-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-build
          path: ${{ steps.build.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 5

  verify-root-config:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.root-config == 'true'
    name: Verify workspace configuration
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test all projects
        run: pnpm test

      - name: Build all projects
        run: pnpm run build

      - name: Check generated scripts are up to date
        run: |
          pnpm run generate:scripts
          if ! git diff --quiet package.json; then
            echo "::error::package.json scripts are stale — run 'pnpm run generate:scripts' and commit the result."
            git diff package.json
            exit 1
          fi
