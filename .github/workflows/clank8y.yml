name: clank8y

on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        required: false

permissions:
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Run clank8y
        uses: clank8y/clank8y@4730793198c7d36dffa286eefab8dbedd960c430
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_CLANK8Y_TOKEN }}
        with:
          prompt: ${{ inputs.prompt }}
          model: anthropic:claude-sonnet-4-6
