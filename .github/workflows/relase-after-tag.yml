name: Create Release on Tag
run-name: ${{ github.actor }} set a tag

on:
  push:
    tags:
      - 'v*'
      # - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: read # @cumulocity-iot/ui-sdk from GitHub Packages

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract projects and their paths from angular.json
        id: set-matrix
        shell: bash
        run: |
          echo "📦 Parsing angular.json..."
          # Only applications produce a releasable plugin ZIP; the shared library is
          # built by ng-packagr and consumed in-repo, so it is not released.
          MATRIX_JSON=$(jq -c '{include: [ (.projects | to_entries[]
            | select(.value.projectType == "application")
            | {project: .key, path: .value.root, dist: .value.architect.build.options.outputPath}) ]}' angular.json)
          echo "Matrix: $MATRIX_JSON"
          # Write valid single-line JSON to output
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          # No pnpm cache in a release build: a cache a pull request wrote could feed what gets published.
          package-manager-cache: false
          # the test workspace's @cumulocity-iot/ui-sdk comes from GitHub Packages
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cumulocity-iot'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fixable advisories get an override, unfixable ones an ignore entry; see AGENTS.md → Dependency Audit.
      - name: Audit dependencies (high+)
        run: pnpm audit --audit-level high

      - name: Build project ${{ matrix.project }}
        run: pnpm exec ng build ${{ matrix.project }}

      - name: Prepare ZIP with version
        shell: bash
        run: |
          mkdir -p release

          project="${{ matrix.project }}"
          pkg_path="${{ matrix.path }}/package.json"

          if [ ! -f "$pkg_path" ]; then
            echo "❌ package.json not found for $project at $pkg_path"
            exit 1
          fi

          name=$(jq -r '.name' "$pkg_path" | sed 's/@//; s/\//-/g')
          version=$(jq -r '.version' "$pkg_path")
          echo "name: ${name}"
          echo "version: ${version}"

          # The build output directory comes straight from angular.json, so it
          # cannot drift from the actual build.
          dist_path="${{ matrix.dist }}"

          if [ -z "$dist_path" ] || [ ! -d "$dist_path" ]; then
            echo "❌ dist path '${dist_path}' not found for $project"
            exit 1
          fi

          zip_name="${name}-${version}.zip"
          (cd "$dist_path" && zip -r "$GITHUB_WORKSPACE/release/${zip_name}" .)
          echo "✅ Created release/${zip_name}"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.project }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 5

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # create the release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: build-*
          merge-multiple: true
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
