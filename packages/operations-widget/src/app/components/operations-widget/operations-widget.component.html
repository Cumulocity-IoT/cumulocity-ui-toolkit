@if (config?.buttons) {
  @for (button of config.buttons; track $index) {
    <button-instance [config]="button" (clickedOperation)="onButtonClick(button, operationModal)">
    </button-instance>
  }
}
<ng-template #operationModal>
  <div class="modal-header">
    <h4 class="modal-title">{{ 'Configure Operation' | translate }}</h4>
  </div>
  <div class="modal-body">
    <form [formGroup]="form">
      <formly-form 
        [form]="form" 
        [fields]="formlyFields" 
        [model]="model"
        (modelChange)="onFormModelChange()">
      </formly-form>
    </form>
    
    <div class="mt-16">
        <label>{{ 'Preview Payload' | translate }}</label>
       
        <pre class="inner-scroll p-8 m-b-0 small"><code>{{ previewPayload }}</code></pre>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-default" (click)="cancelOperation()">{{ 'Cancel' | translate }}</button>
    <button class="btn btn-primary" (click)="sendOperation()" [disabled]="!form.valid">
      {{ 'Send' | translate }}
    </button>
  </div>
</ng-template>
