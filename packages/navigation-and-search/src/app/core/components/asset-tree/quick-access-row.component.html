<!--
  Pinned & Recent: ONE collapsed row, whatever the list lengths (§6.1). The lists open in
  the cascade panel off the container's right edge (`ps-quick-access-panel`); this row
  stays the keyboard region for both.

  Its own `role="tree"` + `aria-activedescendant`, mirroring the hierarchy viewport: the two
  are separate sections, so they take focus separately and hand it to each other at their
  edges rather than sharing one row list — which they could not do anyway, the hierarchy's
  rows being virtualised. `aria-owns` pulls the panel's entries into this tree for the
  accessibility graph, since the panel renders outside this element.
-->
<div
  #region
  class="ps-qa-section"
  role="tree"
  tabindex="0"
  [attr.aria-label]="'Pinned and recent assets' | translate"
  [attr.aria-activedescendant]="activeDescendant()"
  [attr.aria-owns]="expanded() ? 'ps-qa-panel' : null"
  (keydown)="onKeydown($event)"
  (focusin)="hasFocus.set(true)"
  (focusout)="onFocusOut($event)"
>
  <button
    class="ps-qa-row d-flex a-i-center"
    type="button"
    role="treeitem"
    [id]="headerId"
    [attr.aria-expanded]="expanded()"
    [class.ps-qa-row--focused]="hasFocus() && activeIndex() === -1"
    (click)="toggled.emit()" data-cy="navigation-and-search--quick-access"
  >
    <i class="ps-qa-row__star" c8yIcon="star" aria-hidden="true"></i>
    <span>{{ 'Pinned & Recent' | translate }}</span>
    <span class="ps-qa-row__counts text-muted m-l-auto" data-cy="navigation-and-search--quick-access-counts">
      {{ counts().pinned }}+{{ counts().recent }}
    </span>
    <i c8yIcon="{{ expanded() ? 'caret-down' : 'caret-right' }}" aria-hidden="true"></i>
  </button>
</div>
