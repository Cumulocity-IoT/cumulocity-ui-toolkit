<c8y-modal [customFooter]="true" #modal>
  <ng-container c8y-modal-title>
    <h1><i class="c8y-icon c8y-icon-device"></i></h1>
    <h3 id="modal-title">
      {{ 'Add Existing Tenant Option' | translate }}
    </h3>
  </ng-container>
  <div class="modal-body">
    <c8y-form-group class="m-16">
      <label for="categoryInput" translate>Category</label>
      <input
        type="text"
        class="form-control"
        id="categoryInput"
        [(ngModel)]="option.category"
        required
      />
      <c8y-messages> </c8y-messages>
    </c8y-form-group>

    <c8y-form-group class="m-16">
      <label for="keyInput" translate>Key <small class="text-muted">({{ 'optional – leave empty to import all keys of the category' | translate }})</small></label>
      <input type="text" class="form-control" id="keyInput" [(ngModel)]="option.key" />
      <c8y-messages> </c8y-messages>
    </c8y-form-group>

    @if (isImportAllMode) {
      <div class="alert alert-info m-l-16 m-r-16">
        <i c8yIcon="info-circle"></i>
        {{ 'All keys of category "{{ category }}" will be added.' | translate: { category: option.category } }}
      </div>
    }
  </div>
  <div class="modal-footer separator-top bg-level-0 sticky-bottom">
    <button
      title="{{ 'Cancel' | translate }}"
      class="btn btn-default"
      type="button"
      (click)="close()"
    >
      {{ 'Cancel' | translate }}
    </button>
    <button
      title="{{ 'Import' | translate }}"
      class="btn btn-primary"
      type="button"
      (click)="import()"
      [ngClass]="{ 'btn-pending': isLoading }"
      [disabled]="!option.category.length || isLoading"
    >
      {{ 'Import' | translate }}
    </button>
  </div>
</c8y-modal>
