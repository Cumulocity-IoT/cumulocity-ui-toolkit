<button
  [class]="status()"
  [tooltip]="tooltipText()"
  [container]="'body'"
  [placement]="'bottom'"
  [class.open]="open()"
  (click)="toggleDrawer()"
  type="button"
>
  <em>
    @if (open()) {
      <i c8yIcon="close"></i>
    } @else if (counter() <= maxCounter) {
      {{ counter() }}
    } @else {
      {{ maxCounter }}+
    }
  </em>
</button>
