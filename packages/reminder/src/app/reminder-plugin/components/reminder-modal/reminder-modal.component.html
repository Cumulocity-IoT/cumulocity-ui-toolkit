<div class="modal-header separator">
  <h3 translate>reminder.labels.add</h3>
</div>

<form [formGroup]="form" (submit)="submit()">
  <div class="modal-body">
    <formly-form [form]="form" [fields]="fields" [model]="reminder"></formly-form>
  </div>

  <div class="modal-footer">
    <button class="btn btn-default" (click)="close()" type="button" translate>
      reminder.actions.cancel
    </button>

    <button
      class="btn btn-primary"
      [disabled]="!form.valid || isLoading"
      [class.btn-pending]="isLoading"
      type="submit"
      translate
    >
      {{ 'reminder.actions.add-short' | translate }}
    </button>
  </div>
</form>
