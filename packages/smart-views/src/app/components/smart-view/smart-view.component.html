<div class="container-fluid p-24">
  <ng-container *ngIf="loading()">
    <div class="text-center p-24">
      <c8y-loading></c8y-loading>
      <p class="text-muted m-t-8">{{ labels.loading }}</p>
    </div>
  </ng-container>

  <ng-container *ngIf="!loading() && errorMessage()">
    <div class="alert alert-danger" role="alert">
      {{ errorMessage() }}
    </div>
  </ng-container>

  <ng-container *ngIf="!loading() && managedObject() as mo">
    <div class="card">
      <div class="card-header">
        <h4 class="card-title">{{ mo.name || mo.id }}</h4>
      </div>
      <div class="card-block">
        <dl class="dl-horizontal">
          <dt>{{ labels.id }}</dt>
          <dd>{{ mo.id }}</dd>

          <dt>{{ labels.name }}</dt>
          <dd>{{ mo.name || '—' }}</dd>

          <dt>{{ labels.type }}</dt>
          <dd>{{ mo.type || '—' }}</dd>

          <dt>{{ labels.lastUpdated }}</dt>
          <dd>{{ mo.lastUpdated | date: 'medium' }}</dd>
        </dl>
      </div>
    </div>
  </ng-container>
</div>
