<c8y-title>{{ labels.title | translate }}</c8y-title>

@if (errorMessage()) {
  <div class="alert alert-danger" data-cy="smart-views--configuration-error">
    {{ errorMessage() }}
  </div>
}

<c8y-data-grid
  [title]="labels.title"
  [columns]="columns"
  [rows]="configurations()"
  [pagination]="pagination"
  [displayOptions]="displayOptions"
  [actionControls]="actionControls"
  data-cy="smart-views--configuration-grid"
>
  <c8y-column name="icon">
    <ng-template c8yCellRendererDef let-context>
      @if (context.value) {
        <i class="text-16" [c8yIcon]="context.value"></i>
      }
    </ng-template>
  </c8y-column>

  <c8y-ui-empty-state [title]="labels.empty" icon="cog"></c8y-ui-empty-state>
</c8y-data-grid>
