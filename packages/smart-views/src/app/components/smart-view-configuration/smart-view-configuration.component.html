<c8y-title>{{ 'Smart views configuration' }}</c8y-title>

@if (errorMessage()) {
  <div class="alert alert-danger">{{ errorMessage() }}</div>
}

<c8y-data-grid
  [title]="labels.title"
  [columns]="columns"
  [rows]="configurations()"
  [pagination]="pagination"
  [displayOptions]="displayOptions"
  [actionControls]="actionControls"
>
  <c8y-column name="icon">
    <ng-template c8yCellRendererDef let-context>
      @if (context.value) {
        <i [c8yIcon]="context.value" class="text-16"></i>
      }
    </ng-template>
  </c8y-column>

  <c8y-ui-empty-state [title]="labels.empty" icon="cog"></c8y-ui-empty-state>
</c8y-data-grid>
